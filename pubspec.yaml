name: padly
description: FlutterShop is a premium E-commerce UI kit that you can use to build various e-commerce apps using Flutter that works on both Android & iOS. This kit contains 100+ nicely crafted minimal screens that cover everything you need for your shop app.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.10+1
  form_field_validator: ^1.1.0
  cached_network_image: ^3.2.0
  flutter_rating_bar: ^4.0.1
  flutter_widget_from_html_core: ^0.15.1
  animations: ^2.0.11
  url_launcher: ^6.3.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  fluttertoast: ^8.2.12
  supabase_flutter: ^2.8.4
  flutter_firebase_chat_core: ^1.6.8
  flutter_chat_types: ^3.6.2
  firebase_storage: ^12.4.5
  flutter_chat_ui: ^1.6.15
  image_picker: ^1.1.2
  open_filex: ^4.7.0
  file_picker: ^10.1.2
  http: ^1.3.0
  mime: ^2.0.0
  path_provider: ^2.1.5
  firebase_messaging: ^15.2.5
  firebase_app_check: ^0.3.0+1
  flutter_local_notifications: ^19.1.0
  cloud_firestore: ^5.6.6
  googleapis_auth: ^1.6.0
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.5.3
  cloud_functions: ^5.4.0
  intl: ^0.20.2
  lottie: ^3.3.1
  flutter_riverpod: ^2.6.1
  geolocator: ^13.0.2
  avatar_stack: ^3.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  async: ^2.12.0
  uuid: ^4.5.2
  fuzzywuzzy: ^1.2.0
  flutter_dotenv: ^6.0.0
  glassmorphism: ^3.0.0
  flutter_native_splash: ^2.4.6
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/playzi-logo-icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1F1F1F"
  background_image: "assets/images/splash-screen.png"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/Illustration/
    - assets/flags/
    - assets/logo/
    - assets/screens/
    - assets/lottie/success.json

  fonts:
    - family: Plus Jakarta
      fonts:
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Regular.otf
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/plus_jakarta/PlusJakartaDisplay-Bold.otf
          weight: 700
    - family: Grandis Extended
      fonts:
        - asset: assets/fonts/grandis_extended/GrandisExtended-Regular.ttf
        - asset: assets/fonts/grandis_extended/GrandisExtended-Thin.ttf
          weight: 300
        - asset: assets/fonts/grandis_extended/GrandisExtended-Medium.ttf
          weight: 500
        - asset: assets/fonts/grandis_extended/GrandisExtended-Bold.ttf
          weight: 700
        - asset: assets/fonts/grandis_extended/GrandisExtended-Black.ttf
          weight: 900
